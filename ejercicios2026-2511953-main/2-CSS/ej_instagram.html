<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instagram</title>

    <style>
        body {
            margin: 0;
        }

        .galeria {
            display: grid;
            grid-template-columns: 1fr;   /* móvil: 1 columna */
            gap: 4px;
        }

        .galeria img {
            width: 100%;
            display: block;
        }

        @media screen and (min-width: 601px) {
            .galeria {
                grid-template-columns: repeat(3, 1fr);   /* 3 columnas */
            }
        }
    </style>
</head>
<body>

<div class="galeria">
    <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_01.png" alt="Foto 1">
    <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_02.png" alt="Foto 2">
    <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_03.png" alt="Foto 3">
    <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_04.png" alt="Foto 4">
    <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_05.png" alt="Foto 5">
    <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_06.png" alt="Foto 6">
    <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_07.png" alt="Foto 7">
    <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_08.png" alt="Foto 8">
    <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_09.png" alt="Foto 9">
</div>

</body>
</html>
